name: Lock Issues
on:
  # Nightly schedule disabled on the build fork: this housekeeping job locks
  # upstream issues/PRs and must never fire here.
  workflow_dispatch:

permissions:
  issues: "write"

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: dessant/lock-threads@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          issue-inactive-days: 90
          pr-inactive-days: 90
